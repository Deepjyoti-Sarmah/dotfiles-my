##### ────────────────────────────────────────────────
#####  Core Settings
##### ────────────────────────────────────────────────

unbind r
bind r source-file ~/.config/tmux/tmux.conf

# set -g prefix C-b
unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

set -g mouse on
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

set -g base-index 1
set -g pane-base-index 1
set -g renumber-windows on

set -g status-position top
set -g status-justify absolute-centre
set -g status-interval 3
set -g detach-on-destroy off
set -g set-clipboard on
set -g escape-time 0
set -s extended-keys on
set -s extended-keys-format xterm

##### ────────────────────────────────────────────────
#####  Navigation
##### ────────────────────────────────────────────────

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

# Shift+Alt vim keys to switch windows.
# tmux's extended-keys (on by default, and explicitly on here) makes the
# terminal report Shift+Alt+h/l via CSI-u (M-S-h) or xterm modifyOtherKeys
# (M-S-H), NOT the legacy "ESC H" form (M-H). Bind every encoding so it
# works regardless of terminal/format.
bind -n M-H previous-window
bind -n M-L next-window
bind -n M-S-h previous-window
bind -n M-S-l next-window
bind -n M-S-H previous-window
bind -n M-S-L next-window

# Open the new panes in the current path
bind v split-window -v -c "#{pane_current_path}"
bind h split-window -h -c "#{pane_current_path}"

##### ────────────────────────────────────────────────
#####  Copy Mode (vi)
##### ────────────────────────────────────────────────
# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

##### ────────────────────────────────────────────────
#####  Plugins
##### ────────────────────────────────────────────────
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'hendrikmi/tmux-cpu-mem-monitor'


##### ────────────────────────────────────────────────
#####  Theme
##### ────────────────────────────────────────────────
source-file -q ~/.config/tmux/themes/noctalia-layout.conf


##### ────────────────────────────────────────────────
#####  TPM initialization (keep at bottom)
##### ────────────────────────────────────────────────
run '~/.tmux/plugins/tpm/tpm'
source-file -q "$HOME/.config/tmux/themes/noctalia.conf"
