# Noctalia tmux layout - colours follow the active Noctalia palette

set -g status-left-length 200
set -g status-right-length 200
set -g status-left "#[fg=#{@noctalia_primary},bold,bg=#{@noctalia_surface_container_low}] #S #[fg=#{@noctalia_on_surface_variant},nobold,bg=#{@noctalia_surface_container_low}]"
set -g status-right "#{b:pane_current_path}"
set -g window-status-format "#[fg=#{@noctalia_on_surface_variant},bg=#{@noctalia_surface_container_low}] #I:#W"
set -g window-status-current-format "#[fg=#{@noctalia_primary},bold,bg=#{@noctalia_surface_container_low}]  #[underscore]#I:#W"
set -g window-status-last-style "fg=#{@noctalia_on_surface},bg=#{@noctalia_surface_container_low}"
